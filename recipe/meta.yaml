{% set name = "xorg-libXxf86vm" %}
{% set version = "1.1.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://www.x.org/releases/individual/lib/{{ name.split('-')[1] }}-{{ version }}.tar.xz
  sha256: ae50c0f669e0af5a67cc4cd0f54f21d64a64d2660af883e80e95d3fe51b945d8

build:
  number: 0
  # xorg-libxdmcp, libxcb, libx11 aren't available on Windows because their dependencies clash with m2/msys2 and mingw64/ucrt64 toolchains.
  skip: true  # [win]
  run_exports:
    - {{ pin_subpackage(name|lower) }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - pkg-config
    - gnuconfig
    - make
    - autoconf
    - automake
    - gettext
    - libtool
  host:
    - pthread-stubs ==0.3
    - xorg-util-macros ==1.20.2
    - xorg-xorgproto {{ xorg_xorgproto }}
    - xorg-libx11 {{ xorg_libx11 }}
    - xorg-libxext {{ xorg_libxext }}

test:
  commands:
    - test -f $PREFIX/lib/libXxf86vm.dylib  # [osx]
    - test -f $PREFIX/lib/libXxf86vm.so     # [linux]

about:
  home: https://www.x.org/
  license: MIT
  license_family: MIT
  license_file: COPYING
  summary: Xlib-based library for the XFree86-VidMode X extension
  description: |
    Xlib-based library for the XFree86-VidMode X extension
  dev_url: https://gitlab.freedesktop.org/xorg/lib/libxxf86vm
  doc_url: https://gitlab.freedesktop.org/xorg/lib/libxxf86vm

extra:
  recipe-maintainers:
    - hmaarrfk
    - pkgw
    - ehfd
